name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar APK (buildozer directo)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip \
            openjdk-17-jdk-headless \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev \
            git zip unzip curl patch

      - name: Instalar buildozer
        run: |
          sudo python3 -m pip install --upgrade pip
          sudo python3 -m pip install cython==0.29.36 buildozer==1.5.0

      - name: Compilar APK
        working-directory: movil
        run: |
          buildozer -v android debug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: vsol-admin-apk
          path: movil/bin/*.apk